<div class="clear-page">
    <div class="clear-page-main">
        @if(clearArray.length > 1){
            <div 
                class="clear-field" 
                [style.background]="backgroundList.length > 0 ? `url(${backgroundList[charpter]}) no-repeat center/cover` : '#DDD'">
                @for( row of clearArray; track row;let i = $index;) {
                    @for( cell of row; track cell;let j = $index;) {
                        <div
                            class="clear-field-cell"
                            [class.clear-field-cell-exsit]="!cell.isEdge"
                            [style.background]="cell.isEdge ? 'transparent' : '#CCC'"
                            (click)="clickCell(cell)"
                        >
                            @if(!cell.isEdge){
                                <mat-icon 
                                    class="clear-field-icon"
                                    [class.clear-field-icon-clicked]="cell.clicked" 
                                >
                                    {{ cell.label }}
                                </mat-icon>
                            }
                        </div>
                    }
                }
            </div>
        }
    </div>
    <div class="clear-page-rank">
         <ui-button
            (btnClick)="start()">
            START
            </ui-button>
        <ui-button
            modeType="icon" 
            (btnClick)="chooseLibaray()">
            <mat-icon>menu_book</mat-icon>
        </ui-button>

         <div class="clear-time">
            <digital-number 
                [number]="timer_minute" 
                id="minute"
                [limitedigit]="2"
                digitalcolor="#FF0000">
            </digital-number>
            :
            <digital-number 
                [number]="timer_second" 
                id="second" 
                [limitedigit]="2" 
                digitalcolor="#FF0000">
            </digital-number>
        </div>

        <div>
            combo: {{ combo }}
            score: {{ score }}

        </div>
    </div>
</div>
