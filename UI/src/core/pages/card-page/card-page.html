<div class="card-page">
    <div>
        <div class="card-page-cpu">
        @for(cpucard of cpuOnCard; track cpucard){
            <fun-card
                class="cpuCard"
                [attr.data-id]="cpucard.id"
                [cardData]="cpucard">

            </fun-card>
        }
    </div>
    <div class="card-page-user">
         @for(usercard of userOnCard; track usercard){
            <fun-card
                (click)="showDetail(usercard)"
                [cardData]="usercard">

            </fun-card>
            @if( usercard.showDetail){
                <div class="card-page-user-detail">
                    <div>
                        {{ usercard.name }}
                    </div>
                    <div>
                        {{ usercard.description }}
                    </div>
                    <div (click)="attack($event,usercard)">
                        attack
                    </div>
                </div>
            }
            
        }
    </div>

    </div>
    <div class="card-page-turn">
        <div>
            cpu cost {{ cpuCost}}
        </div>
        <div (click)="nextTurn()">
            next turn
        </div>
        <div>
            your cost {{ userCost }}
        </div>
    </div>

    
</div>
