<div class="card-edit">
    <div class="card-edit-title">
        <ui-button
            modeType="icon" 
            (btnClick)="chooseLibaray()">
            <mat-icon>menu_book</mat-icon>
        </ui-button>
        <ui-button
            modeType="icon" 
            (btnClick)="chooseList()">
            <mat-icon>playlist_add</mat-icon>
        </ui-button>
        @if(noLibaray || cardLibaray.length == 0){
            <div class="card-edit-warning">
                no libaray
            </div>
        }
    </div>
    <div class="card-edit-content">
        <div class="card-edit-main">
            <cdk-virtual-scroll-viewport
                class="card-edit-all"
                itemSize="140"
                (scrolledIndexChange)="scrolledIndexChange($event)"
                orientation="horizontal">
                <div #cardLib class="card-edit-all-inner">
                    <fun-card
                        *cdkVirtualFor="let card of cardLibaray;let i = index"
                        [orignCardData]="card">
                    </fun-card>
                </div>
            </cdk-virtual-scroll-viewport>
        
          
            <div class="card-edit-buttom">
                 <div class="card-edit-bin" #cardBin>
                        <mat-icon>delete</mat-icon>
                </div>
                <div 
                    class="card-edit-editing"
                    #cardEdit
                >
                    @for(card of cardLibaray;track card){
                        <fun-card
                            [orignCardData]="card">
                        </fun-card>
                    }
                       
                </div>
            </div>
            
               
            
        </div>
        <!-- drag & drop -->
        <div class="card-edit-list">
            @for( cardgroup of cardList;track cardgroup){
                <div class="card-edit-group">
                    {{ cardgroup.name }}
                </div>
            }
            <div class="card-edit-new">
                +
            </div>
        </div>
    </div>
    
</div>
