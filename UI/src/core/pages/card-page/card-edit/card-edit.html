<div class="card-edit">
    <div class="card-edit-title">
        <div class="card-edit-btngroup">
            <ui-button 
                modeType="icon"
                (btnClick)="goBack()">
                <mat-icon>arrow_back</mat-icon>
            </ui-button>
            <ui-button
                modeType="icon" 
                (btnClick)="chooseLibaray()">
                <mat-icon>menu_book</mat-icon>
            </ui-button>
            <ui-button
                modeType="icon" 
                (btnClick)="chooseList()">
                <mat-icon>playlist_add</mat-icon>
            </ui-button>
        </div>
        
        @if( noLibaray || cardLibaray.length === 0 ){
            <div class="card-edit-warning">
                no libaray
            </div>
        }
    </div>
    <div class="card-edit-content">
        <div class="card-edit-main">
            
            <cdk-virtual-scroll-viewport
                class="card-edit-all"
                itemSize="140"
                orientation="horizontal">
                <!--  (scrolledIndexChange)="scrolledIndexChange($event)" -->
                <div 
                    #cardLib 
                    class="card-edit-all-inner">
                    <fun-card
                        *cdkVirtualFor="let card of cardLibaray;let i = index"
                        [orignCardData]="card">
                    </fun-card>
                </div>
            </cdk-virtual-scroll-viewport>
        
            
            <div class="card-edit-board">

                <div class="card-edit-left">
                    <div class="card-edit-left-info">

                    </div>
                    <div class="card-edit-left-operation">
                        <div class="card-edit-bin" #cardBin>
                            <mat-icon>delete</mat-icon>
                        </div>
                        <ui-button class="card-edit-done" (btnClick)="saveJson()" [disabled]="!editing">
                            <mat-icon (click)="saveJson()">done-outline</mat-icon>
                        </ui-button>
                    </div>
                  
                </div>
                
                <div 
                    class="card-edit-editing"
                    #cardEdit
                >
                    @for(card of cardEditing;track card){
                        <fun-card
                            [orignCardData]="card">
                        </fun-card>
                    }
                </div>
                
            </div> 
            
            
        </div>




        <!-- drag & drop -->
        <div class="card-edit-list">
            @for( cardgroup of cardList;track cardgroup){
                <div class="card-edit-group">
                    <ui-button  (click)="selectEditing(cardgroup)" [disabled]="editing">
                        {{ cardgroup.name }}
                    </ui-button>
                    <ui-button modeType="icon" class="card-edit-group-delete" (btnClick)="deleteGroup(cardgroup)" [disabled]="editing">
                        <mat-icon>delete</mat-icon>
                    </ui-button>
                </div>
                
            }
            @if(!editing){
                <ui-button class="card-edit-new" (btnClick)="editing = true" [disabled]="editing">
                    <mat-icon>+</mat-icon>
                </ui-button>
            }@else{
                <ui-input class="card-edit-input" [(value)]="inputName"></ui-input>
            }
            
        </div>
    </div>
</div>
