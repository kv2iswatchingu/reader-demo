<div class="card-battle">
    <div class="card-battle-battle">
        <div class="card-battle-main">
            <div class="card-battle-cpu">

        </div>
        <div class="card-page-cpucard" #cpucard>
        @for(cpucard of cpuOnCard; track cpucard){
            <fun-card
                class="cpuCard"
                [attr.data-id]="cpucard.id"
                [cardData]="cpucard">

            </fun-card>
        }
        </div>
        <div class="card-battle-usercard" #usercard>
            @for(usercard of userOnCard; track usercard){
                <fun-card
                    (click)="showDetail(usercard)"
                    [cardData]="usercard">

                </fun-card>
                @if( usercard.showDetail){
                    <div class="card-battle-user-detail">
                        <div>
                            {{ usercard.name }}
                        </div>
                        <div>
                            {{ usercard.description }}
                        </div>
                        <div (click)="attack($event,usercard)">
                            attack
                        </div>
                    </div>
                }
                
            }
        </div>
        <div class="card-battle-user">

        </div>
        <div class="card-battle-userhandcard">
            
        </div>
        </div>
        <div class="card-battle-area">
            <!-- cdkdrop list -->
        </div>
        
    </div>

    <div class="card-battle-turn">
        <div>
            cpu cost {{ cpuCost}}
        </div>
        <div (click)="nextTurn()">
            next turn
        </div>
        <div>
            your cost {{ userCost }}
        </div>
    </div>

</div>
