<div class="tetoris-page">
    <div class="tetoris-page-main">
        @for( rows of tetoris; track rows;let i = $index;) {
            @if(i > 1){
                @for ( cell of rows; track $index;let j = $index) {
                    <div 
                        class="tetoris-page-main-item"
                        [style.background-color]="cell.color"
                        >
                    </div>
                }
            }
        }
    </div>
    <div class="tetoris-page-borad">
        <div class="tetoris-page-borad-pred">

        </div>
        <div>
            <ui-button (btnClick)="start()"></ui-button>
        </div>
        <div class="tetoris-page-borad-score">
            <div>
                <digital-number 
                    [number]="timer_minute" 
                    id="minute"
                    [limitedigit]="2"
                    digitalcolor="#FF0000">
                </digital-number>
                :
                <digital-number 
                    [number]="timer_second" 
                    id="second" 
                    [limitedigit]="2" 
                    digitalcolor="#FF0000">
                </digital-number>
            </div>
            <div>
                {{score}}
            </div>
        </div>
    </div>
    <div class="tetoris-page-rank">
        
    </div>
</div>
